services:

  backend:
    build: ./backend/
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./backend/app/:/app
    command: sh -c 'fastapi dev main.py --host 0.0.0.0 --port 80'

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"

volumes:
  db:
